name: Sync Images to GHCR


on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:


permissions:
  contents: read
  packages: write


env:
  REGISTRY: ghcr.io


jobs:

  sync:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout
        uses: actions/checkout@v7


      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            yq \
            skopeo


      - name: Login GHCR
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ secrets.GITHUB_TOKEN }}" \
          | skopeo login \
              --username "${{ github.actor }}" \
              --password-stdin \
              "${REGISTRY}"


      - name: Sync images
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}

        run: |
          set -euo pipefail


          if [ ! -f images.yml ]; then
            echo "images.yml missing"
            exit 1
          fi


          COUNT=$(yq -r '.images | length' images.yml)


          if [ "$COUNT" -eq 0 ]; then
            echo "No images configured"
            exit 0
          fi



          for i in $(seq 0 $((COUNT-1)))
          do

            NAME=$(yq -r ".images[$i].name" images.yml)
            SOURCE=$(yq -r ".images[$i].source" images.yml)
            TAG=$(yq -r ".images[$i].tag" images.yml)


            echo "=============================="
            echo "Sync ${SOURCE}:${TAG}"
            echo "=============================="


            TARGET="${REGISTRY}/${OWNER}/${NAME}:${TAG}"


            echo "Copy linux/amd64 image"


            skopeo copy \
              --override-os linux \
              --override-arch amd64 \
              "docker://${SOURCE}:${TAG}" \
              "docker://${TARGET}"


            echo "Finished: ${TARGET}"


          done



      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/.docker