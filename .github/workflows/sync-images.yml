name: Sync Images to GHCR

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: sync-images-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test sync logic
        shell: bash
        run: bash tests/sync-images.test.sh

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            yq \
            skopeo

      - name: Login GHCR
        shell: bash
        run: |
          set -euo pipefail

          echo "${{ secrets.GITHUB_TOKEN }}" \
          | skopeo login \
              --username "${{ github.actor }}" \
              --password-stdin \
              "${REGISTRY}"

      - name: Sync images
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: bash scripts/sync-images.sh

      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/.docker
